  - {id: robotics-va-thiet-bi-tu-hanh,   type: concept, cau_hoi: "Robot thi công, xe/máy tự hành, drone nào đã dùng được thật trên công trường?"}
  - {id: llm-va-ocr-tai-lieu-xay-dung,   type: concept, cau_hoi: "LLM (RAG/fine-tune) và OCR xử lý hồ sơ, bản vẽ, hợp đồng xây dựng tới đâu?"}
