# ontology.proposal.yaml — copy phần object_types vào ontology.yaml CHỈ SAU KHI owner duyệt (R1)
# APPROVAL: owner duyệt qua AskUserQuestion 2026-10-29 — "Duyệt đề xuất" (6 tài liệu + entity_kind),
#   ngôn ngữ thân bài: tiếng Việt (quote giữ nguyên gốc), phạm vi case study: toàn cầu + Việt Nam.
#   Đã copy thay đổi entity vào ontology.yaml cùng ngày.
# Pack: "Ứng dụng AI vào ngành xây dựng" — ai-nganh-xay-dung
# Thay đổi DUY NHẤT so với starter ontology: entity thêm property enum `entity_kind`.

object_types:
  entity:
    folder: entities
    properties:
      - {name: entity_kind, type: enum, values: [technology, organization, standard]}

rationale:
  - entity_kind: các tài liệu chia sẻ 2 nhóm thực thể lặp lại — công nghệ (robotics, iot, llm, ocr,
    digital-twin, bim, autonomous-equipment...) và tổ chức (Komatsu, Trimble, Buildots, Vinci,
    Coteccons...); owner lọc được bằng `query --where entity_kind=technology`.
  - standard: chuẩn/quy định (vd ISO 19650, quy định chuyển đổi số ngành xây dựng VN) xuất hiện
    trong >=2 tài liệu (công trường số + hạ tầng tập đoàn).
  - không thêm document type hay link type nào: starter (concept, guide, comparison, decision-record;
    cites / about / depends-on / compares) đủ cho bộ tài liệu bên dưới.
  - chi phí: mỗi entity phải khai entity_kind (enum được tool kiểm tra); không tốn gì thêm.

